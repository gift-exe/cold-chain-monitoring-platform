# Local development stack. Start with `make dev`.
# Prometheus and Grafana are added in the iteration that first needs them (I8).
name: coldchain

x-service: &service
  build: { context: ., dockerfile: Containerfile }
  image: localhost/coldchain-services:dev
  restart: unless-stopped
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
    MQTT_HOST: mosquitto
    MQTT_PORT: 1883
    KAFKA_BOOTSTRAP: kafka:19092
    TEMPORAL_ADDRESS: temporal:7233
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT}
  depends_on:
    postgres: { condition: service_healthy }
    mosquitto: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    # PostgreSQL 17 with TimescaleDB and PostGIS
    image: docker.io/timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      COLDCHAIN_DB_PASSWORD: ${COLDCHAIN_DB_PASSWORD}
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coldchain"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mosquitto:
    image: docker.io/eclipse-mosquitto:2.0.20
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper)
    image: docker.io/apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168  # seven days, so readings can be replayed after a database restore
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  temporal:
    # Temporal development server: durable workflow timers, persisted to SQLite on a volume
    image: docker.io/temporalio/temporal:1.8.3
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db",
              "--ui-port", "8233", "--log-level", "warn"]
    user: root   # so the server can write to the named volume
    ports:
      - "${TEMPORAL_PORT}:7233"
      - "${TEMPORAL_UI_PORT}:8233"
    volumes:
      - temporaldata:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  ingestion-bridge:
    <<: *service
    command: ["python", "-m", "coldchain.ingestion.bridge"]

  storage-writer:
    <<: *service
    command: ["python", "-m", "coldchain.ingestion.writer"]

  detection:
    <<: *service
    command: ["python", "-m", "coldchain.detection.service"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:19092
      DETECTION_SWEEP_S: 2     # short for development and tests; minutes in production
      MODEL_DIR: /app/models
    volumes:
      - ./models:/app/models:ro

  incident-service:
    <<: *service
    command: ["python", "-m", "coldchain.incidents.service"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:19092
      TEMPORAL_ADDRESS: temporal:7233
      AUDIT_ANCHOR_DIR: /app/anchors
      CODE_SECRET: ${CODE_SECRET}
    volumes:
      - ./anchors:/app/anchors   # outside the database, on the host (Section 3.4.6)
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      temporal: { condition: service_healthy }

  notification-service:
    <<: *service
    command: ["uvicorn", "coldchain.notify.service:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${NOTIFY_PORT}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:19092
      TEMPORAL_ADDRESS: temporal:7233
      AT_API_URL: ${SMS_GATEWAY_URL}
      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      SMS_CALLBACK_TOKEN: ${SMS_CALLBACK_TOKEN}
      CODE_SECRET: ${CODE_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  sms-gateway:
    # Emulator of the SMS gateway (Africa's Talking protocol) for failure testing; see README to use the
    # Africa's Talking sandbox instead
    <<: *service
    command: ["uvicorn", "coldchain.simulator.sms_gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${SMS_GATEWAY_PORT}:8000"
    environment:
      AT_API_KEY: ${AT_API_KEY}
      SMS_DELIVERY_CALLBACK: http://notification-service:8000/sms/${SMS_CALLBACK_TOKEN}/delivery
      SMS_INBOUND_CALLBACK: http://notification-service:8000/sms/${SMS_CALLBACK_TOKEN}/inbound
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *service
    command: ["uvicorn", "coldchain.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:19092
      TEMPORAL_ADDRESS: temporal:7233
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT}
      AUDIT_ANCHOR_DIR: /app/anchors
      CODE_SECRET: ${CODE_SECRET}
    volumes:
      - ./anchors:/app/anchors:ro
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  temporaldata:
  pgdata:
  kafkadata:
  mqttdata:
