server {
    listen 80;
    root /usr/share/nginx/html;

    # the API, under /api on this origin
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;        # WebSocket (/api/ws)
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
    }

    # client-side routes (/map, /incidents/12, ...) all load the app
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
    }
}
