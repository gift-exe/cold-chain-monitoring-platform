# Development broker. Anonymous access is for development only; device credentials are a later iteration.
listener 1883
allow_anonymous true
# Persistent sessions keep QoS 1 messages for the bridge across broker restarts (NFR6)
persistence true
persistence_location /mosquitto/data/
# The default limit (1,000) drops readings for the bridge while it restarts. 500,000 messages is far more
# than arrive in a restart; batched uploads count as one message each.
max_queued_messages 500000
max_inflight_messages 100
log_dest stdout
