[project]
name = "coldchain"
version = "0.1.0"
description = "Closed-loop cold chain integrity monitoring and response prototype (MIT Professional Master's Project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "confluent-kafka>=2.5",
    "fastapi>=0.160",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "temporalio>=1.35",
    "uvicorn>=0.35",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the local stack running (make up)",
    "resilience: restarts containers; slow (make test-resilience)",
]
addopts = "-m 'not resilience'"

[tool.ruff]
line-length = 110
target-version = "py312"
